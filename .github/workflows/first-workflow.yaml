name: "Continuous Integration Workflow"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-tests:
    runs-on: [self-hosted, is-enabled]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: "./.dotnet"
        with:
          dotnet-version: '9.0'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Go Unit Tests
        timeout-minutes: 10
        run: |
          for SERVICE in "shippingservice" "productcatalogservice"; do
            echo "Testing $SERVICE..."
            pushd src/$SERVICE
            go test ./...
            popd
          done

      - name: .NET Unit Tests
        timeout-minutes: 10
        run: |
          for SERVICE in "cartservice"; do
            echo "Testing $SERVICE..."
            pushd src/$SERVICE
            dotnet test --no-build --verbosity normal
            popd
          done



  deployment-tests:

    runs-on: [self-hosted, is-enabled]
    needs: code-tests
    if: github.event_name == 'pull_request'
    env:
      PROJECT_ID: "online-boutique-ci"
      PR_CLUSTER: "prs-gke-cluster"
      REGION: "us-central1"
      # Use PR number from GitHub context (not parsed from GITHUB_REF)
      NAMESPACE: "pr${{ github.event.pull_request.number }}"

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GKE
        run: |
          yes | gcloud auth configure-docker us-docker.pkg.dev
          gcloud container clusters get-credentials $PR_CLUSTER \
            --region $REGION \
            --project $PROJECT_ID

      - name: Create PR Namespace
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Namespace
          metadata:
            name: $NAMESPACE
          EOF

      - name: Build + Deploy PR Images to GKE
        timeout-minutes: 20
        run: |
          echo "Deploying to namespace: $NAMESPACE"
          skaffold config set --global local-cluster false
          skaffold run \
            --default-repo=us-docker.pkg.dev/$PROJECT_ID/containers \
            --tag=$GITHUB_SHA \
            --namespace=$NAMESPACE \
            -p network-policies

      - name: Wait For Pods
        timeout-minutes: 20
        run: |
          set -x
          kubectl config set-context --current --namespace=$NAMESPACE
          DEPLOYMENTS=(
            redis-cart
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )
          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do
            kubectl wait \
              --for=condition=available \
              --timeout=1000s \
              deployment/$DEPLOYMENT
          done

      - name: Smoke Test
        timeout-minutes: 5
        run: |
          set -x
          # Start fresh loadgenerator pod
          kubectl delete pod -l app=loadgenerator

          # Wait for requests to accumulate, with a retry limit to avoid infinite loop
          REQUEST_COUNT="0"
          MAX_RETRIES=60   # 60 * 5s = 5 minutes max
          RETRY=0

          while [[ "$REQUEST_COUNT" -lt "50" ]]; do
            if [[ "$RETRY" -ge "$MAX_RETRIES" ]]; then
              echo "ERROR: Timed out waiting for 50 requests. Got $REQUEST_COUNT."
              exit 1
            fi
            sleep 5
            RETRY=$((RETRY + 1))
            REQUEST_COUNT=$(kubectl logs -l app=loadgenerator \
              | grep Aggregated \
              | awk '{print $2}' \
              || echo "0")
            echo "Requests so far: $REQUEST_COUNT (attempt $RETRY/$MAX_RETRIES)"
          done

          # Ensure there are no errors hitting endpoints
          ERROR_COUNT=$(kubectl logs -l app=loadgenerator \
            | grep Aggregated \
            | awk '{print $3}' \
            | sed "s/[(][^)]*[)]//g" \
            || echo "0")

          echo "Total requests: $REQUEST_COUNT | Errors: $ERROR_COUNT"

          if [[ "$ERROR_COUNT" -gt "0" ]]; then
            echo "ERROR: Smoke test failed with $ERROR_COUNT errors."
            exit 1
          fi

          echo "Smoke test passed."

    