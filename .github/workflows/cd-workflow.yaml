name: "Continuous Integration"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 182618816509.dkr.ecr.ap-south-1.amazonaws.com
  ECR_REPO_PREFIX: microservices-platform

jobs:
  code-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: "./.dotnet"
        with:
          dotnet-version: '10.0'

      - name: Go Unit Tests
        timeout-minutes: 10
        run: |
          for SERVICE in "shippingservice" "productcatalogservice"; do
            echo "Testing $SERVICE..."
            pushd src/$SERVICE
            go test ./...
            popd
          done

      - name: .NET Unit Tests
        timeout-minutes: 10
        run: |
          for SERVICE in "cartservice"; do
            echo "Testing $SERVICE..."
            pushd src/$SERVICE
            dotnet test --verbosity normal
            popd
          done

  build-and-push:
    runs-on: ubuntu-latest
    needs: code-tests
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION \
            | docker login --username AWS \
              --password-stdin $ECR_REGISTRY

      - name: Build and Push Images to ECR
        timeout-minutes: 30
        run: |
          SERVICES=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )
          for SERVICE in "${SERVICES[@]}"; do
            echo "Building $SERVICE..."
            BUILD_CONTEXT="src/$SERVICE"
            
            if [ "$SERVICE" == "cartservice" ]; then
              BUILD_CONTEXT="src/cartservice/src"
            fi
            docker build \
              -t $ECR_REGISTRY/$ECR_REPO_PREFIX/$SERVICE:$GITHUB_SHA \
              -t $ECR_REGISTRY/$ECR_REPO_PREFIX/$SERVICE:latest \
              $BUILD_CONTEXT
            echo "Pushing $SERVICE..."
            docker push $ECR_REGISTRY/$ECR_REPO_PREFIX/$SERVICE:$GITHUB_SHA
            docker push $ECR_REGISTRY/$ECR_REPO_PREFIX/$SERVICE:latest
          done

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --name microservices-eks-cluster \
            --region $AWS_REGION

      - name: Deploy to EKS
        timeout-minutes: 10
        run: |
          kubectl apply -f kubernetes-manifests/

      - name: Wait for Pods
        timeout-minutes: 20
        run: |
          DEPLOYMENTS=(
            adservice
            cartservice
            checkoutservice
            currencyservice
            emailservice
            frontend
            loadgenerator
            paymentservice
            productcatalogservice
            recommendationservice
            shippingservice
          )
          for DEPLOYMENT in "${DEPLOYMENTS[@]}"; do
            kubectl wait \
              --for=condition=available \
              --timeout=300s \
              deployment/$DEPLOYMENT
          done

      - name: Smoke Test
        timeout-minutes: 5
        run: |
          set -x
          kubectl delete pod -l app=loadgenerator

          REQUEST_COUNT="0"
          MAX_RETRIES=60
          RETRY=0

          while [[ "$REQUEST_COUNT" -lt "50" ]]; do
            if [[ "$RETRY" -ge "$MAX_RETRIES" ]]; then
              echo "ERROR: Timed out waiting for 50 requests. Got $REQUEST_COUNT."
              exit 1
            fi
            sleep 5
            RETRY=$((RETRY + 1))
            REQUEST_COUNT=$(kubectl logs -l app=loadgenerator \
              | grep Aggregated \
              | awk '{print $2}' \
              || echo "0")
            echo "Requests so far: $REQUEST_COUNT (attempt $RETRY/$MAX_RETRIES)"
          done

          ERROR_COUNT=$(kubectl logs -l app=loadgenerator \
            | grep Aggregated \
            | awk '{print $3}' \
            | sed "s/[(][^)]*[)]//g" \
            || echo "0")

          echo "Total requests: $REQUEST_COUNT | Errors: $ERROR_COUNT"

          if [[ "$ERROR_COUNT" -gt "0" ]]; then
            echo "ERROR: Smoke test failed with $ERROR_COUNT errors."
            exit 1
          fi

          echo "Smoke test passed."

      - name: Get Frontend URL
        run: |
          echo "Frontend URL:"
          kubectl get svc frontend-external \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'